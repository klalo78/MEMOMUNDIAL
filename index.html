<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego de Memoria Personalizado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* CUADRÍCULA: 4 columnas por 6 filas */
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 90px);
            gap: 10px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Estilo base de cada ficha */
        .ficha {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            background-color: #ccc;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Imagen de fondo (dorso) y la foto real */
        .ficha img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.2s ease;
        }

        /* Al principio, la foto real está oculta y se ve el dorso */
        .ficha .foto-real {
            opacity: 0;
        }

        .ficha .foto-dorso {
            opacity: 1;
        }

        /* Cuando la ficha se voltea, mostramos la foto real y ocultamos el dorso */
        .ficha.volteada .foto-real {
            opacity: 1;
        }

        .ficha.volteada .foto-dorso {
            opacity: 0;
        }

        /* Desactivar clicks en fichas ya volteadas */
        .ficha.volteada {
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>Juego de Memoria (4x6)</h1>

    <div class="tablero" id="tablero"></div>

    <script>
        // 1. Creamos el array con los nombres de tus 12 imágenes
        const imagenesOriginales = [
            '01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg',
            '07.jpg', '08.jpg', '09.jpg', '10.jpg', '11.jpg', '12.jpg'
        ];

        // 2. Duplicamos la lista para tener los 12 pares (24 fichas)
        let mazo = [...imagenesOriginales, ...imagenesOriginales];

        const tableroElemento = document.getElementById('tablero');

        // 3. Función para mezclar el mazo (Algoritmo Fisher-Yates)
        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 4. Función para armar el tablero visualmente
        function crearTablero() {
            tableroElemento.innerHTML = ''; // Limpiamos el tablero por si acaso
            mezclar(mazo); // Mezclamos las fotos

            mazo.forEach((nombreImagen) => {
                // Creamos el contenedor de la ficha
                const ficha = document.createElement('div');
                ficha.classList.add('ficha');
                ficha.dataset.imagen = nombreImagen; // Guardamos su "identidad" secreta

                // Creamos la imagen del dorso (back.jpg)
                const imgDorso = document.createElement('img');
                imgDorso.src = 'back.jpg';
                imgDorso.classList.add('foto-dorso');

                // Creamos la imagen real (01.jpg, etc.)
                const imgReal = document.createElement('img');
                imgReal.src = nombreImagen;
                imgReal.classList.add('foto-real');

                // Metemos ambas imágenes dentro de la ficha
                ficha.appendChild(imgDorso);
                ficha.appendChild(imgReal);

                // Le agregamos el evento del click (lo programaremos en el siguiente paso)
                ficha.addEventListener('click', voltearFicha);

                // Metemos la ficha en el tablero
                tableroElemento.appendChild(ficha);
            });
        }

        // 5. Función provisoria para ver cómo se dan vuelta al hacer click
        function voltearFicha() {
            this.classList.toggle('volteada');
        }

        // Arrancar el juego al cargar la página
        crearTablero();
    </script>

</body>
</html>
