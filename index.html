<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - Edición Especial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        /* ========================================================
           ANIMACIÓN PARA EL LOGO.PNG
           ======================================================== */
        @keyframes moviLogo {
            0% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
            }
            50% {
                transform: scale(1.04) rotate(1deg) ;
                filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6));
            }
            100% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
            }
        }

        /* ========================================================
           PANTALLA DE ENTRADA (LOBBY)
           ======================================================== */
        #pantalla-entrada {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.4);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .logo-grande img {
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
            animation: moviLogo 4s ease-in-out infinite; 
        }

        .btn-general {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #2ecc71;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 40px; /* Espacio para que no pise los créditos */
        }

        .btn-general:hover {
            transform: scale(1.08);
            background-color: #27ae60;
        }

        /* ESTILOS DE CRÉDITO Y WHATSAPP (SUTIL) */
        .creditos-contenedor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7); /* Blanco sutil semi-transparente */
            font-size: 0.95rem;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .enlace-whatsapp {
            color: #25d366; /* Verde original de WhatsApp */
            font-size: 1.3rem;
            text-decoration: none;
            transition: transform 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
        }

        .enlace-whatsapp:hover {
            transform: scale(1.2);
            color: #1ebd58;
        }

        /* ========================================================
           ZONA DEL JUEGO
           ======================================================== */
        #zona-juego {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-juego {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 340px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .logo-contenedor img {
            max-width: 120px;
            height: auto;
            display: block;
            animation: moviLogo 4s ease-in-out infinite; 
        }

        .temporizador {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(231, 76, 60, 0.9);
            padding: 6px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            text-align: center;
            letter-spacing: 2px;
        }

        /* CUADRÍCULA: 3 columnas por 5 filas */
        .tablero {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(5, 100px);
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            perspective: 1000px; 
        }

        .ficha {
            width: 100px;
            height: 100px;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            border-top: 3px solid #3498db;
            border-bottom: 3px solid #3498db;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #ffffff;
            border-radius: 12px;
            background-color: #ffffff;
        }

        .panel-interno {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .ficha.volteada .panel-interno {
            transform: rotateY(180deg);
        }

        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
        }

        .cara img, .cara video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cara-dorso {
            background-color: #ffffff;
        }

        .cara-frente {
            background-color: #fff;
            transform: rotateY(180deg);
        }

        .ficha.bloqueada {
            cursor: default;
        }

        /* ========================================================
           PANTALLA DE DERROTA
           ======================================================== */
        #pantalla-derrota {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #pantalla-derrota h2 {
            font-size: 2.2rem;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        #pantalla-derrota p {
            font-size: 1.3rem;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div id="pantalla-entrada">
        <div class="logo-grande">
            <img src="logo.png" alt="Logo Principal Animado">
        </div>
        <button class="btn-general" onclick="comenzarExperiencia()">JUGAR</button>
        
        <div class="creditos-contenedor">
            <span>diseño multimedia</span>
            <a class="enlace-whatsapp" href="https://wa.me/541149496902" target="_blank" rel="noopener noreferrer" title="Contactar por WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
    </div>

    <div id="zona-juego">
        <div class="header-juego">
            <div class="logo-contenedor">
                <img src="logo.png" alt="Logo Animado">
            </div>
            <div class="temporizador" id="reloj">00:40</div>
        </div>

        <div class="tablero" id="tablero"></div>

        <div id="pantalla-derrota">
            <h2>Perdiste</h2>
            <p>Intentamos de nuevo?</p>
            <button class="btn-general" onclick="reiniciarJuego()">Volver a jugar</button>
        </div>
    </div>

    <script>
        const bancoJugadores = [
            '01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg',
            '07.jpg', '08.jpg', '09.jpg', '10.jpg', '11.jpg', '12.jpg'
        ];

        let mazo = [];
        let fichasVolteadas = [];
        let bloqueoTablero = false;
        
        let tiempoRestante = 40; 
        let intervaloReloj = null;
        let juegoIniciado = false;

        const tableroElemento = document.getElementById('tablero');
        const relojElemento = document.getElementById('reloj');
        const pantallaDerrota = document.getElementById('pantalla-derrota');

        // Audios globales fijos
        const sonidoBobo = new Audio('bobo.mp3');
        const sonidoTicTac = new Audio('tictac.mp3');
        sonidoTicTac.loop = true;
        
        const sonidoHinchada = new Audio('hinchada.mp3');
        sonidoHinchada.loop = true; 
        
        const sonidoMal = new Audio('mal.mp3');

        function comenzarExperiencia() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            document.getElementById('pantalla-entrada').style.display = 'none';
            document.getElementById('zona-juego').style.display = 'flex';

            crearTablero();
        }

        function seleccionarJugadores() {
            let cartasRestantes = bancoJugadores.filter(img => img !== '01.jpg');
            cartasRestantes.sort(() => Math.random() - 0.5);
            let seleccionados = ['01.jpg', ...cartasRestantes.slice(0, 6)];
            return [...seleccionados, ...seleccionados, 'bobo.mp4'];
        }

        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function iniciarTiempo() {
            juegoIniciado = true;
            sonidoTicTac.play().catch(e => console.log(e));

            intervaloReloj = setInterval(() => {
                tiempoRestante--;
                
                relojElemento.innerText = `00:${tiempoRestante.toString().padStart(2, '0')}`;

                if (tiempoRestante <= 0) {
                    finalizarPorTiempo();
                }
            }, 1000);
        }

        function finalizarPorTiempo() {
            clearInterval(intervaloReloj);
            sonidoTicTac.pause();
            
            sonidoMal.currentTime = 0;
            sonidoMal.play().catch(e => console.log(e));
            
            sonidoHinchada.currentTime = 0;
            sonidoHinchada.play().catch(e => console.log(e));
            
            bloqueoTablero = true;
            pantallaDerrota.style.display = 'flex';
        }

        function reiniciarJuego() {
            tiempoRestante = 40;
            fichasVolteadas = [];
            bloqueoTablero = false;
            juegoIniciado = false;
            
            sonidoTicTac.pause();
            sonidoTicTac.currentTime = 0;
            sonidoMal.pause();
            sonidoMal.currentTime = 0;
            sonidoHinchada.pause();
            sonidoHinchada.currentTime = 0;

            relojElemento.innerText = "00:40";
            pantallaDerrota.style.display = 'none';

            crearTablero();
        }

        function crearTablero() {
            tableroElemento.innerHTML = '';
            mazo = seleccionarJugadores();
            mezclar(mazo);

            mazo.forEach((archivo) => {
                const ficha = document.createElement('div');
                ficha.classList.add('ficha');
                ficha.dataset.archivo = archivo;

                const esVideo = archivo.endsWith('.mp4');
                ficha.dataset.tipo = esVideo ? 'especial' : 'normal';

                const panelInterno = document.createElement('div');
                panelInterno.classList.add('panel-interno');

                const caraDorso = document.createElement('div');
                caraDorso.classList.add('cara', 'cara-dorso');
                const imgDorso = document.createElement('img');
                imgDorso.src = 'logo.jpg'; 
                caraDorso.appendChild(imgDorso);

                const caraFrente = document.createElement('div');
                caraFrente.classList.add('cara', 'cara-frente');
                
                if (esVideo) {
                    const videoElement = document.createElement('video');
                    videoElement.src = archivo;
                    videoElement.muted = true;
                    videoElement.playsInline = true;
                    videoElement.id = 'video-fantasma';
                    caraFrente.appendChild(videoElement);
                } else {
                    const imgReal = document.createElement('img');
                    imgReal.src = archivo;
                    caraFrente.appendChild(imgReal);
                }

                panelInterno.appendChild(caraDorso);
                panelInterno.appendChild(caraFrente);
                ficha.appendChild(panelInterno);

                ficha.addEventListener('click', alHacerClick);
                tableroElemento.appendChild(ficha);
            });
        }

        function alHacerClick() {
            if (bloqueoTablero) return;
            if (this.classList.contains('volteada') || this.classList.contains('bloqueada')) return;

            if (!juegoIniciado) {
                iniciarTiempo();
            }

            if (this.dataset.tipo === 'especial') {
                bloqueoTablero = true;
                
                sonidoBobo.currentTime = 0;
                sonidoBobo.play().catch(e => console.log(e));

                const video = document.getElementById('video-fantasma');
                if (video) {
                    video.currentTime = 0;
                    video.play().catch(e => console.log(e));
                }

                this.classList.add('volteada');

                setTimeout(() => {
                    this.classList.remove('volteada');
                    if (video) video.pause();
                    bloqueoTablero = false;
                }, 2000); 
                
                return;
            }

            const nombreImagen = this.dataset.archivo;
            const nombreAudio = nombreImagen.replace('.jpg', '.mp3');
            
            const sonidoAsociado = new Audio(nombreAudio);
            sonidoAsociado.volume = 1.0; 
            
            sonidoAsociado.currentTime = 0;
            sonidoAsociado.play().catch(e => console.log(e));

            this.classList.add('volteada');
            fichasVolteadas.push(this);

            if (fichasVolteadas.length === 2) {
                comprobarPar();
            }
        }

        function comprobarPar() {
            const [ficha1, ficha2] = fichasVolteadas;

            if (ficha1.dataset.archivo === ficha2.dataset.archivo) {
                ficha1.classList.add('bloqueada');
                ficha2.classList.add('bloqueada');
                fichasVolteadas = [];
                
                const normalesPorResolver = document.querySelectorAll('.ficha[data-tipo="normal"]:not(.bloqueada)');
                if (normalesPorResolver.length === 0) {
                    clearInterval(intervaloReloj);
                    sonidoTicTac.pause();
                    setTimeout(() => alert("¡Felicitaciones! Encontraste todos los pares."), 500);
                }
            } else {
                bloqueoTablero = true;

                setTimeout(() => {
                    ficha1.classList.remove('volteada');
                    ficha2.classList.remove('volteada');
                    fichasVolteadas = [];
                    bloqueoTablero = false;
                }, 1000);
            }
        }
    </script>

</body>
</html>
