<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego de Memoria Personalizado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* back.png ahora es el fondo de toda la pantalla */
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        /* CUADRÍCULA: 4 columnas por 6 filas */
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 90px);
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.85); /* Fondo del tablero semi-transparente */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            perspective: 1000px; 
        }

        /* Contenedor de la ficha */
        .ficha {
            width: 90px;
            height: 90px;
            cursor: pointer;
            position: relative;
        }

        /* El panel interno que va a girar */
        .panel-interno {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        /* Rotación al estar volteada */
        .ficha.volteada .panel-interno {
            transform: rotateY(180deg);
        }

        /* Caras del panel */
        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
        }

        .cara img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Cara del dorso (dorso.jpg) */
        .cara-dorso {
            background-color: #2c3e50;
        }

        /* Cara de la foto real */
        .cara-frente {
            background-color: #fff;
            transform: rotateY(180deg);
        }

        .ficha.bloqueada {
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>Juego de Memoria</h1>

    <div class="tablero" id="tablero"></div>

    <script>
        // Nombres de tus 12 imágenes
        const imagenesOriginales = [
            '01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg',
            '07.jpg', '08.jpg', '09.jpg', '10.jpg', '11.jpg', '12.jpg'
        ];

        let mazo = [...imagenesOriginales, ...imagenesOriginales];
        let fichasVolteadas = [];
        let bloqueoTablero = false;
        const tableroElemento = document.getElementById('tablero');

        // Preparamos el audio para el efecto de sonido
        const sonidoClick = new Audio('click.mp3');

        // Mezclar mazo
        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Crear la estructura visual
        function crearTablero() {
            tableroElemento.innerHTML = '';
            mezclar(mazo);

            mazo.forEach((nombreImagen) => {
                const ficha = document.createElement('div');
                ficha.classList.add('ficha');
                ficha.dataset.imagen = nombreImagen;

                const panelInterno = document.createElement('div');
                panelInterno.classList.add('panel-interno');

                // Cara Dorso (dorso.jpg)
                const caraDorso = document.createElement('div');
                caraDorso.classList.add('cara', 'cara-dorso');
                const imgDorso = document.createElement('img');
                imgDorso.src = 'dorso.jpg'; // Cambiado a dorso.jpg
                caraDorso.appendChild(imgDorso);

                // Cara Frente (Foto real)
                const caraFrente = document.createElement('div');
                caraFrente.classList.add('cara', 'cara-frente');
                const imgReal = document.createElement('img');
                imgReal.src = nombreImagen;
                caraFrente.appendChild(imgReal);

                panelInterno.appendChild(caraDorso);
                panelInterno.appendChild(caraFrente);
                ficha.appendChild(panelInterno);

                ficha.addEventListener('click', alHacerClick);
                tableroElemento.appendChild(ficha);
            });
        }

        // Lógica de juego al tocar una ficha
        function alHacerClick() {
            if (bloqueoTablero) return;
            if (this.classList.contains('volteada') || this.classList.contains('bloqueada')) return;

            // Reproducir el sonido inmediatamente al hacer click
            sonidoClick.currentTime = 0; // Reinicia el audio por si se hace click rápido
            sonidoClick.play().catch(error => {
                // El navegador podría bloquear el audio si el usuario no interactuó antes con la página
                console.log("El audio requiere interacción previa del usuario:", error);
            });

            this.classList.add('volteada');
            fichasVolteadas.push(this);

            if (fichasVolteadas.length === 2) {
                comprobarPar();
            }
        }

        function comprobarPar() {
            const [ficha1, ficha2] = fichasVolteadas;

            if (ficha1.dataset.imagen === ficha2.dataset.imagen) {
                ficha1.classList.add('bloqueada');
                ficha2.classList.add('bloqueada');
                fichasVolteadas = [];
            } else {
                bloqueoTablero = true;

                setTimeout(() => {
                    ficha1.classList.remove('volteada');
                    ficha2.classList.remove('volteada');
                    fichasVolteadas = [];
                    bloqueoTablero = false;
                }, 1000); // 1 segundo mostrando el error antes de girar de vuelta
            }
        }

        crearTablero();
    </script>

</body>
</html>
