<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria - Edición Especial</title>
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reseteo básico */
        * { box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-image: url('back.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        /* ANIMACIONES */
        @keyframes moviLogo {
            0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4)); }
            50% { transform: scale(1.04) rotate(1deg); filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6)); }
        }

        @keyframes titilar {
            0%, 100% { color: rgba(255, 255, 255, 0.6); }
            50% { color: rgba(255, 255, 255, 1); text-shadow: 0 0 10px rgba(255,255,255,0.8); }
        }

        /* ESTRUCTURA PÁGINA DE ENTRADA */
        #pantalla-entrada {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.4);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .logo-grande img {
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
            animation: moviLogo 4s ease-in-out infinite; 
        }

        .btn-general {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #2ecc71;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 30px;
        }

        .btn-general:hover { transform: scale(1.08); background-color: #27ae60; }

        .bloque-contacto {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .bloque-contacto i { color: #25d366; font-size: 1.8rem; }
        .bloque-contacto span { 
            font-size: 0.9rem; font-style: italic; 
            animation: titilar 2s infinite ease-in-out; 
        }

        /* ESTRUCTURA JUEGO */
        #zona-juego {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-juego {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 340px;
            margin-bottom: 15px;
            gap: 10px;
        }

        .logo-contenedor img {
            max-width: 120px;
            height: auto;
            animation: moviLogo 4s ease-in-out infinite; 
        }

        .temporizador {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(231, 76, 60, 0.9);
            padding: 6px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        .tablero {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(5, 100px);
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            perspective: 1000px; 
        }

        .ficha {
            width: 100px; height: 100px; cursor: pointer; position: relative;
            box-sizing: border-box;
            border-top: 3px solid #3498db; border-bottom: 3px solid #3498db;
            border-left: 3px solid #ffffff; border-right: 3px solid #ffffff;
            border-radius: 12px; background-color: #ffffff;
        }

        .panel-interno {
            width: 100%; height: 100%; position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ficha.volteada .panel-interno { transform: rotateY(180deg); }

        .cara { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; overflow: hidden; }
        .cara img, .cara video { width: 100%; height: 100%; object-fit: cover; }
        .cara-dorso { background-color: #ffffff; }
        .cara-frente { background-color: #fff; transform: rotateY(180deg); }
        .ficha.bloqueada { cursor: default; }

        #pantalla-derrota {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 20;
            flex-direction: column; align-items: center; justify-content: center;
            border-radius: 12px; color: #ffffff; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ENTRADA -->
    <div id="pantalla-entrada">
        <div class="logo-grande"><img src="logo.png" alt="Logo"></div>
        <button class="btn-general" onclick="comenzarExperiencia()">JUGAR</button>
        <a class="bloque-contacto" href="https://wa.me/541149496902" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
            <span>dise&ntilde;o multimedia</span>
        </a>
    </div>

    <!-- ZONA JUEGO -->
    <div id="zona-juego">
        <div class="header-juego">
            <div class="logo-contenedor"><img src="logo.png" alt="Logo"></div>
            <div class="temporizador" id="reloj">00:40</div>
        </div>
        <div class="tablero" id="tablero"></div>
        <div id="pantalla-derrota">
            <h2>Perdiste</h2>
            <p>Intentamos de nuevo?</p>
            <button class="btn-general" onclick="reiniciarJuego()">Volver a jugar</button>
        </div>
    </div>

    <script>
        // Lógica de juego simplificada para asegurar funcionamiento
        const bancoJugadores = ['01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg', '07.jpg', '08.jpg', '09.jpg', '10.jpg', '11.jpg', '12.jpg'];
        let mazo = [], fichasVolteadas = [], bloqueoTablero = false, tiempoRestante = 40, intervaloReloj = null, juegoIniciado = false;

        function comenzarExperiencia() {
            document.documentElement.requestFullscreen().catch(e => console.log(e));
            document.getElementById('pantalla-entrada').style.display = 'none';
            document.getElementById('zona-juego').style.display = 'flex';
            crearTablero();
        }

        function seleccionarJugadores() {
            let restantes = bancoJugadores.filter(img => img !== '01.jpg');
            restantes.sort(() => Math.random() - 0.5);
            let sel = ['01.jpg', ...restantes.slice(0, 6)];
            return [...sel, ...sel, 'bobo.mp4'].sort(() => Math.random() - 0.5);
        }

        function crearTablero() {
            const tablero = document.getElementById('tablero');
            tablero.innerHTML = '';
            mazo = seleccionarJugadores();
            mazo.forEach(archivo => {
                const esVideo = archivo.endsWith('.mp4');
                const ficha = document.createElement('div');
                ficha.className = 'ficha';
                ficha.innerHTML = `
                    <div class="panel-interno">
                        <div class="cara cara-dorso"><img src="logo.jpg"></div>
                        <div class="cara cara-frente">${esVideo ? '<video id="video-fantasma" src="bobo.mp4" muted playsinline></video>' : `<img src="${archivo}">`}</div>
                    </div>
                `;
                ficha.onclick = () => alHacerClick(ficha, archivo, esVideo);
                tablero.appendChild(ficha);
            });
        }

        function alHacerClick(ficha, archivo, esVideo) {
            if (bloqueoTablero || ficha.classList.contains('volteada')) return;
            if (!juegoIniciado) {
                juegoIniciado = true;
                new Audio('tictac.mp3').play();
                intervaloReloj = setInterval(() => {
                    tiempoRestante--;
                    document.getElementById('reloj').innerText = `00:${tiempoRestante.toString().padStart(2, '0')}`;
                    if (tiempoRestante <= 0) {
                        clearInterval(intervaloReloj);
                        new Audio('mal.mp3').play();
                        new Audio('hinchada.mp3').play();
                        document.getElementById('pantalla-derrota').style.display = 'flex';
                    }
                }, 1000);
            }

            if (esVideo) {
                bloqueoTablero = true;
                new Audio('bobo.mp3').play();
                document.getElementById('video-fantasma').play();
                ficha.classList.add('volteada');
                setTimeout(() => { ficha.classList.remove('volteada'); bloqueoTablero = false; }, 2000);
            } else {
                new Audio(archivo.replace('.jpg', '.mp3')).play();
                ficha.classList.add('volteada');
                fichasVolteadas.push({ficha, archivo});
                if (fichasVolteadas.length === 2) {
                    if (fichasVolteadas[0].archivo === fichasVolteadas[1].archivo) {
                        fichasVolteadas.forEach(f => f.ficha.classList.add('bloqueada'));
                        fichasVolteadas = [];
                    } else {
                        bloqueoTablero = true;
                        setTimeout(() => {
                            fichasVolteadas.forEach(f => f.ficha.classList.remove('volteada'));
                            fichasVolteadas = [];
                            bloqueoTablero = false;
                        }, 1000);
                    }
                }
            }
        }

        function reiniciarJuego() {
            location.reload(); // Recarga la página para limpiar todo fácilmente
        }
    </script>
</body>
</html>
