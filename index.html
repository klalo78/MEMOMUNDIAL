<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Juego de Memoria Personalizado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* CUADRÍCULA: 4 columnas por 6 filas */
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 90px);
            gap: 12px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* Perspectiva para el efecto 3D de los paneles */
            perspective: 1000px; 
        }

        /* Contenedor de la ficha (maneja la perspectiva individual) */
        .ficha {
            width: 90px;
            height: 90px;
            cursor: pointer;
            position: relative;
        }

        /* El panel interno que realmente va a girar */
        .panel-interno {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-radius: 8px;
        }

        /* Cuando la ficha tiene la clase 'volteada', el panel gira 180 grados */
        .ficha.volteada .panel-interno {
            transform: rotateY(180deg);
        }

        /* Caras del panel (Dorso y Frente) */
        .cara {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Oculta la cara contraria al girar */
            border-radius: 8px;
            overflow: hidden;
        }

        .cara img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Cara del dorso (back.png) - Se ve al principio */
        .cara-dorso {
            background-color: #34495e;
        }

        /* Cara de la foto real - Está rotada por defecto detrás del dorso */
        .cara-frente {
            background-color: #fff;
            transform: rotateY(180deg);
        }

        /* Desactivar clicks en fichas ya resueltas o volteadas */
        .ficha.bloqueada {
            cursor: default;
        }
    </style>
</head>
<body>

    <h1>Juego de Memoria</h1>

    <div class="tablero" id="tablero"></div>

    <script>
        // Nombres de tus 12 imágenes en la carpeta principal
        const imagenesOriginales = [
            '01.jpg', '02.jpg', '03.jpg', '04.jpg', '05.jpg', '06.jpg',
            '07.jpg', '08.jpg', '09.jpg', '10.jpg', '11.jpg', '12.jpg'
        ];

        // Duplicamos para armar las 24 fichas (12 pares)
        let mazo = [...imagenesOriginales, ...imagenesOriginales];

        let fichasVolteadas = [];
        let bloqueoTablero = false;
        const tableroElemento = document.getElementById('tablero');

        // Mezclar mazo
        function mezclar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Crear la estructura visual con efecto panel
        function crearTablero() {
            tableroElemento.innerHTML = '';
            mezclar(mazo);

            mazo.forEach((nombreImagen) => {
                const ficha = document.createElement('div');
                ficha.classList.add('ficha');
                ficha.dataset.imagen = nombreImagen;

                const panelInterno = document.createElement('div');
                panelInterno.classList.add('panel-interno');

                // Cara Dorso (back.png)
                const caraDorso = document.createElement('div');
                caraDorso.classList.add('cara', 'cara-dorso');
                const imgDorso = document.createElement('img');
                imgDorso.src = 'back.png'; // Cambiado a .png
                caraDorso.appendChild(imgDorso);

                // Cara Frente (Foto real)
                const caraFrente = document.createElement('div');
                caraFrente.classList.add('cara', 'cara-frente');
                const imgReal = document.createElement('img');
                imgReal.src = nombreImagen;
                caraFrente.appendChild(imgReal);

                // Armamos la estructura de capas
                panelInterno.appendChild(caraDorso);
                panelInterno.appendChild(caraFrente);
                ficha.appendChild(panelInterno);

                ficha.addEventListener('click', alHacerClick);
                tableroElemento.appendChild(ficha);
            });
        }

        // Lógica de juego al tocar una ficha
        function alHacerClick() {
            if (bloqueoTablero) return;
            if (this.classList.contains('volteada') || this.classList.contains('bloqueada')) return;

            // Volteamos visualmente la ficha usando la clase
            this.classList.add('volteada');
            fichasVolteadas.push(this);

            // Si ya dimos vuelta dos, controlamos el par
            if (fichasVolteadas.length === 2) {
                comprobarPar();
            }
        }

        function comprobarPar() {
            const [ficha1, ficha2] = fichasVolteadas;

            if (ficha1.dataset.imagen === ficha2.dataset.imagen) {
                // ¡Coinciden! Las dejamos fijas y bloqueadas
                ficha1.classList.add('bloqueada');
                ficha2.classList.add('bloqueada');
                fichasVolteadas = [];
            } else {
                // No coinciden. Bloqueamos el click un segundo para que el usuario las vea
                bloqueoTablero = true;

                setTimeout(() => {
                    // Les quitamos la clase y el CSS hace el efecto de giro inverso automáticamente
                    ficha1.classList.remove('volteada');
                    ficha2.classList.remove('volteada');
                    fichasVolteadas = [];
                    bloqueoTablero = false;
                }, 1000); // 1 segundo de espera antes de volver a taparlas
            }
        }

        // Iniciar
        crearTablero();
    </script>

</body>
</html>
